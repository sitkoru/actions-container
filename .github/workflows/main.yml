name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build common
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: common
          tags: actions-container:check
          load: true
          push: false
      - name: Verify common
        run: docker run --rm -v "$PWD/scripts:/checks:ro" actions-container:check bash /checks/verify-common.sh
      - name: Calculate version
        id: version
        run: |
          test -f version.json
          VERSION=$(docker run --rm -v "$PWD:/repo:ro" -w /repo actions-container:check nbgv get-version -v SimpleVersion)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build wasm
        uses: docker/build-push-action@v7
        with:
          context: .
          target: wasm
          tags: actions-container-wasm:check
          load: true
          push: false
      - name: Verify wasm
        run: docker run --rm -v "$PWD/scripts:/checks:ro" actions-container-wasm:check bash /checks/verify-wasm.sh
  release:
    name: Release
    needs: [build, wasm]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
