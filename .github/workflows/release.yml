name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: actions-container-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || github.sha }}
          fetch-depth: 0
      - name: Prepare
        id: prep
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PRIVATE_REGISTRY: ${{ secrets.YANDEX_DOCKER_REGISTRY_URL }}
        run: |
          DOCKER_IMAGE=ghcr.io/sitkoru/actions-container
          DOCKER_IMAGE_WASM=ghcr.io/sitkoru/actions-container-wasm
          DOCKER_IMAGE_YANDEX=${PRIVATE_REGISTRY}/0xdev/actions-container
          DOCKER_IMAGE_WASM_YANDEX=${PRIVATE_REGISTRY}/0xdev/actions-container-wasm
          VERSION="v${RELEASE_VERSION}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            VERSION=latest
          else
            [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git fetch --tags origin
            if git show-ref --verify --quiet "refs/tags/$VERSION"; then
              test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$(git rev-parse HEAD)"
            fi
          fi
          TAGS="${DOCKER_IMAGE}:${VERSION}"
          TAGS_WASM="${DOCKER_IMAGE_WASM}:${VERSION}"
          TAGS_YANDEX="${DOCKER_IMAGE_YANDEX}:${VERSION}"
          TAGS_WASM_YANDEX="${DOCKER_IMAGE_WASM_YANDEX}:${VERSION}"
          if [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MINOR=${VERSION%.*}
            MAJOR=${MINOR%.*}
            TAGS="$TAGS,${DOCKER_IMAGE}:${MINOR},${DOCKER_IMAGE}:${MAJOR},${DOCKER_IMAGE}:latest"
            TAGS_WASM="$TAGS_WASM,${DOCKER_IMAGE_WASM}:${MINOR},${DOCKER_IMAGE_WASM}:${MAJOR},${DOCKER_IMAGE_WASM}:latest"
            TAGS_YANDEX="$TAGS_YANDEX,${DOCKER_IMAGE_YANDEX}:${MINOR},${DOCKER_IMAGE_YANDEX}:${MAJOR},${DOCKER_IMAGE_YANDEX}:latest"
            TAGS_WASM_YANDEX="$TAGS_WASM_YANDEX,${DOCKER_IMAGE_WASM_YANDEX}:${MINOR},${DOCKER_IMAGE_WASM_YANDEX}:${MAJOR},${DOCKER_IMAGE_WASM_YANDEX}:latest"
          fi
          TAGS_FINAL="$TAGS,$TAGS_YANDEX"
          TAGS_WASM_FINAL="$TAGS_WASM,$TAGS_WASM_YANDEX"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS_FINAL}" >> "$GITHUB_OUTPUT"
          echo "tags-wasm=${TAGS_WASM_FINAL}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build common for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          target: common
          tags: actions-container:check
          load: true
          push: false
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.revision=${{ steps.checkout.outputs.commit }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
      - name: Verify common
        run: docker run --rm -v "$PWD/scripts:/checks:ro" actions-container:check bash /checks/verify-common.sh
      - name: Build wasm for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          target: wasm
          tags: actions-container-wasm:check
          load: true
          push: false
          pull: ${{ github.event_name == 'schedule' }}
          no-cache-filters: ${{ github.event_name == 'schedule' && 'wasm' || '' }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.revision=${{ steps.checkout.outputs.commit }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
      - name: Verify wasm
        run: docker run --rm -v "$PWD/scripts:/checks:ro" actions-container-wasm:check bash /checks/verify-wasm.sh
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.BOT_NAME }}
          password: ${{ secrets.BOT_TOKEN }}
      - name: Login to Yandex Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.YANDEX_DOCKER_REGISTRY_URL }}
          username: ${{ secrets.YANDEX_DOCKER_REGISTRY_LOGIN }}
          password: ${{ secrets.YANDEX_DOCKER_REGISTRY_TOKEN }}
      - name: Push verified common
        env:
          TAGS: ${{ steps.prep.outputs.tags }}
        run: |
          test -n "$TAGS"
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            docker tag actions-container:check "$tag"
            docker push "$tag"
          done
      - name: Push verified wasm
        env:
          TAGS: ${{ steps.prep.outputs.tags-wasm }}
        run: |
          test -n "$TAGS"
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            docker tag actions-container-wasm:check "$tag"
            docker push "$tag"
          done
      - name: Tag published version
        if: ${{ github.event_name != 'schedule' }}
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$VERSION"; then
            git tag "$VERSION" HEAD
            git push origin "refs/tags/$VERSION"
          fi
